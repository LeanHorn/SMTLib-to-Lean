name = "smt2lean"
version = "0.1.0"
defaultTargets = ["smt2lean"]

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt.git"
rev = "5bdc51674065a074ece67b04e10024e9f426ec1f"

[[require]]
name = "cvc5"
git = "https://github.com/abdoo8080/lean-cvc5.git"
rev = "7e3365990661b697ccb30e92d6912f4cc6589322"

[[lean_lib]]
name = "Smt2Lean"

[[lean_lib]]
name = "TestSupport"
roots = ["tests.backend.ArrayModel", "tests.backend.Support", "tests.backend.Arithmetic",
  "tests.backend.BitVec", "tests.backend.Datatypes", "tests.backend.Sessions", "tests.backend.Sharing", "tests.backend.ParserSupport", "tests.backend.ParserTerms", "tests.backend.Definitions"]

[[lean_exe]]
name = "smt2lean"
root = "Main"
supportInterpreter = true

[[lean_exe]]
name = "testReconstruction"
root = "tests.backend.Reconstruction"
supportInterpreter = true

[[lean_exe]]
name = "testSource"
root = "tests.backend.Source"

[[lean_exe]]
name = "testParser"
root = "tests.backend.Parser"

[[lean_exe]]
name = "testTranslation"
root = "tests.backend.Translation"
supportInterpreter = true

[[lean_exe]]
name = "testHorn"
root = "tests.backend.Horn"

[[lean_exe]]
name = "testArrays"
root = "tests.backend.Arrays"
supportInterpreter = true
